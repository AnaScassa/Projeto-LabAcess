

services:

  traefik:
    image: traefik:v3.7
    command:
      - --log.level=DEBUG
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443


      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --providers.docker.usebindportip=true
      - --providers.docker.network=traefik-public
      - --api
      - --api.dashboard=true
      - --certificatesresolvers.leresolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.leresolver.acme.email=mkeiler@unicamp.br    
      - --certificatesresolvers.leresolver.acme.storage=/le/acme.json
      - --certificatesresolvers.leresolver.acme.tlschallenge=true
    ports:
      - 80:80
      - 443:443
    networks:
      - traefik-public
    secrets:
      - traefik_password
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - 'traefik_le:/le'
    labels:
      - 'traefik.enable=true'
      - "traefik.http.routers.traefik.rule=Host(`dev.ccs.unicamp.br`) "
      - 'traefik.http.routers.traefik.service=api@internal'
      - 'traefik.http.services.traefik.loadbalancer.server.port=8080'
      - 'traefik.http.routers.traefik.tls.certresolver=leresolver'
      - 'traefik.http.routers.traefik.entrypoints=websecure'
      - 'traefik.http.routers.traefik.middlewares=authtraefik'
      - "traefik.http.middlewares.authtraefik.basicauth.usersfile=/run/secrets/traefik_password"
      - 'traefik.http.routers.http-catchall.rule=hostregexp({host:.+})'
      - 'traefik.http.routers.http-catchall.entrypoints=web'
      - 'traefik.http.routers.http-catchall.middlewares=redirect-to-https'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'


  my-app:
    image: containous/whoami:v1.3.0
    networks:
      - traefik-public
    command:
      - --port=8082 
    labels:
      - 'traefik.enable=true'
      - "traefik.http.routers.my-app.rule=Host(`dev.ccs.unicamp.br`)&& PathPrefix(`/whoami`)"
      - 'traefik.http.services.my-app.loadbalancer.server.port=8082'
      - 'traefik.http.routers.my-app.entrypoints=web, websecure'
      - 'traefik.http.routers.my-app-router.service=my-app'
      - 'traefik.http.routers.my-app.tls=true'
      - 'traefik.http.routers.my-app.tls.certresolver=leresolver'
      - "traefik.http.middlewares.my-app-ipallowlist.ipwhitelist.sourcerange=143.106.5.1/24, 10.10.0.1/16"
      - "traefik.http.routers.my-app.middlewares=my-app-ipallowlist"


volumes:
  traefik_le:

secrets:
  traefik_password:
    file: ../secrets/traefik_password.txt
    
networks:
  traefik-public:
    external: true
