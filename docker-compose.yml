services:
  backend:
    build:
      context: ./smartcard
      dockerfile: docker/backend.Dockerfile

    container_name: smartcard_backend

    expose:
      - "8080"

    restart: always

    volumes:
      - media_volume:/app/media

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password
      - secret_authorization
      - secret_api_key

    env_file:
      - .env

    command: /app/init.sh

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - users_service
      - mailhog

  users_service:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_service
    env_file:
      - .env

    expose:
      - "8000"

    restart: always

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: postgres

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password

    command: ./init.sh

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=Host(`users.localhost`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=8000"

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mailhog

  frontend:
    build:
      context: ./frontend

    container_name: frontend_react

    environment:
      VITE_FRONTEND_URL: localhost
      VITE_SMARTCARD_URL: http://api.localhost
      VITE_USERS_URL: http://users.localhost

    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    depends_on:
      - backend
      - users_service

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  mrbs_mariadb:
    image: mariadb:10.11

    container_name: mrbs_mariadb

    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: mrbs
      MYSQL_USER: mrbsuser
      MYSQL_PASSWORD: 123

    ports:
      - "3306:3306"

    restart: always

    volumes:
      - mrbs_mariadb_data:/var/lib/mysql
      - ./mrbs/mrbs.sql:/docker-entrypoint-initdb.d/mrbs_init.sql

  postgres:
    image: postgres:15

    container_name: postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always

    volumes:
      - postgres_smartcard:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: always

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock

  whoami:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_algorithm:
    file: ./secrets/jwt_algorithm.txt
  secret_authorization:
    file: ./secrets/secret_authorization.txt
  secret_api_key:
    file: ./secrets/secret_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  rabbitmq_data:
  media_volume:
  postgres_smartcard:
  mrbs_mariadb_data: