services:
  backend:
    build:
      context: ./smartcard
      dockerfile: docker/backend.Dockerfile

    container_name: smartcard_backend

    ports:
      - "8080:8080"

    restart: always

    volumes:
      - media_volume:/app/media

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password
      - secret_authorization
      - secret_api_key

    env_file:
      - .env

    command: /app/init.sh

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - users_service
      - mailhog

  users_service:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_service
    env_file:
      - .env

    ports:
      - "8001:8000"

    restart: always

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: postgres

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password

    command: ./init.sh

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mailhog

  frontend:
    build:
      context: ./frontend

    container_name: frontend_react

    environment:
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-localhost}

    ports:
      - "3000:80"

    restart: always

    depends_on:
      - backend
      - users_service

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  mrbs_mariadb:
    image: mariadb:10.11

    container_name: mrbs_mariadb

    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: mrbs
      MYSQL_USER: mrbsuser
      MYSQL_PASSWORD: 123

    ports:
      - "3306:3306"

    restart: always

    volumes:
      - mrbs_mariadb_data:/var/lib/mysql
      - ./mrbs/mrbs.sql:/docker-entrypoint-initdb.d/mrbs_init.sql

  postgres:
    image: postgres:15

    container_name: postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always

    volumes:
      - postgres_smartcard:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: always

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_algorithm:
    file: ./secrets/jwt_algorithm.txt
  secret_authorization:
    file: ./secrets/secret_authorization.txt
  secret_api_key:
    file: ./secrets/secret_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  rabbitmq_data:
  media_volume:
  postgres_smartcard:
  mrbs_mariadb_data: