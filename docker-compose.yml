services:
  backend:
    build:
      context: ./smartcard
      dockerfile: docker/backend.Dockerfile

    container_name: smartcard_backend

    expose:
      - "8080"

    restart: always

    volumes:
      - media_volume:/app/media
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/run/wazuh-certs/root-ca.pem:ro

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      MQTT_HOST: rabbitmq
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: smartcard-rpa-consumer
      WAZUH_API_URL: https://wazuh.manager:55000
      WAZUH_API_USERNAME: "${WAZUH_API_USERNAME:-wazuh-wui}"
      WAZUH_API_PASSWORD: "${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}"
      WAZUH_API_CA_BUNDLE: /run/wazuh-certs/root-ca.pem
      WAZUH_WINDOWS_AGENT_ID: ${WAZUH_WINDOWS_AGENT_ID:-001}

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password
      - secret_authorization
      - secret_api_key

    env_file:
      - .env

    command: /app/init.sh

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - users_service
      - mailhog
      - wazuh.manager

  users_service:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_service
    env_file:
      - .env

    expose:
      - "8000"

    restart: always

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM_FILE: /run/secrets/jwt_algorithm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: postgres

    secrets:
      - jwt_secret
      - jwt_algorithm
      - postgres_password

    command: ./init.sh

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=Host(`users.localhost`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=8000"

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mailhog

  frontend:
    build:
      context: ./frontend

    container_name: frontend_react

    environment:
      VITE_FRONTEND_URL: localhost
      VITE_SMARTCARD_URL: http://api.localhost
      VITE_USERS_URL: http://users.localhost

    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    depends_on:
      - backend
      - users_service

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  mrbs_mariadb:
    image: mariadb:10.11

    container_name: mrbs_mariadb

    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: mrbs
      MYSQL_USER: mrbsuser
      MYSQL_PASSWORD: 123

    ports:
      - "3306:3306"

    restart: always

    volumes:
      - mrbs_mariadb_data:/var/lib/mysql
      - ./mrbs/mrbs.sql:/docker-entrypoint-initdb.d/mrbs_init.sql

  postgres:
    image: postgres:15

    container_name: postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always

    volumes:
      - postgres_smartcard:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    build: ./rabbitmq
    container_name: rabbitmq

    ports:
      - "5672:5672"    
      - "15672:15672" 
      - "1883:1883"    
      - "15675:15675"  
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "56000:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: "${WAZUH_API_USERNAME:-wazuh-wui}"
      API_PASSWORD: "${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}"
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh-docker/single-node/config/wazuh_api/api.yaml:/var/ossec/api/configuration/api.yaml:ro
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/var/ossec/api/configuration/ssl/wazuh.manager.pem:ro
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/var/ossec/api/configuration/ssl/wazuh.manager-key.pem:ro
      - ./wazuh-docker/single-node/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.10
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh-docker/single-node/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.10
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: "${WAZUH_API_USERNAME:-wazuh-wui}"
      API_PASSWORD: "${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}"
    volumes:
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-docker/single-node/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh-docker/single-node/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  whoami:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_algorithm:
    file: ./secrets/jwt_algorithm.txt
  secret_authorization:
    file: ./secrets/secret_authorization.txt
  secret_api_key:
    file: ./secrets/secret_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  rabbitmq_data:
  media_volume:
  postgres_smartcard:
  mrbs_mariadb_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom: