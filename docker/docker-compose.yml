# este docker compose é para ilustrar a estrutura do projeto, não é o docker compose final
# para rodar é necessário colocar esse arquivo na raiz do projeto, onde estão as pastas smartcard, users-service, frontend e docker
services:

  backend:
    build:
      context: ./smartcard
      dockerfile: docker/backend.Dockerfile

    container_name: smartcard_backend

    ports:
      - "8000:8000"

    restart: always

    volumes:
      - ./smartcard:/app
      - media_volume:/app/media

    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

    depends_on:
      - postgres
      - redis
      - users_service
      - rabbitmq

  users_service:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_service

    ports:
      - "8001:8000"

    restart: always

    volumes:
      - ./users_service:/app

    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

    depends_on:
      - postgres
      - rabbitmq

  users_consumer:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_consumer

    restart: always

    volumes:
      - ./users_service:/app

    command: python users/rabbitmq/consumer.py

    depends_on:
      - rabbitmq
      - users_service

  celery:
    build:
      context: ./smartcard
      dockerfile: docker/celery.Dockerfile

    container_name: smartcard_celery

    command: >
      celery -A core worker
      --loglevel=info
      --concurrency=1
      -Q fila_rapida,fila_media,fila_pesada

    restart: always

    depends_on:
      - backend
      - redis
      - users_service

    volumes:
      - ./smartcard:/app
      - media_volume:/app/media

  frontend:
    build:
      context: ./frontend

    container_name: frontend_react

    ports:
      - "3000:80"

    restart: always

    depends_on:
      - backend
      - users_service

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  postgres:
    image: postgres:15

    container_name: postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always

    volumes:
      - postgres_smartcard:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: always

volumes:
  media_volume:
  postgres_smartcard:

