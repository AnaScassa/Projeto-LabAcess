services:

  backend:
    build:
      context: ./smartcard
      dockerfile: docker/backend.Dockerfile

    container_name: smartcard_backend

    ports:
      - "8000:8000"

    restart: always

    volumes:
      - ./smartcard:/app
      - media_volume:/app/media
      - C:/Users/anacha/Desktop/pasta:/testeshared

    command: >
      sh -c "
        until python -c 'import socket; s=socket.socket(); s.connect((\"postgres\",5432))'; do
          echo 'Esperando postgres...';
          sleep 2;
        done;
        until python -c 'import socket; s=socket.socket(); s.connect((\"redis\",6379))'; do
          echo 'Esperando redis...';
          sleep 2;
        done;
        until python -c 'import socket; s=socket.socket(); s.connect((\"rabbitmq\",5672))'; do
          echo 'Esperando rabbitmq...';
          sleep 2;
        done;
        python manage.py migrate;
        python manage.py runserver 0.0.0.0:8000 &
        celery -A core worker \
          --loglevel=info \
          --concurrency=1 \
          -Q fila_rapida,fila_media,fila_pesada
      "

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - users_service

  users_service:
    build:
      context: ./users_service
      dockerfile: docker/users.Dockerfile

    container_name: users_service

    ports:
      - "8001:8000"

    restart: always

    volumes:
      - ./users_service:/app

    command: >
      sh -c "
        until python -c 'import socket; s=socket.socket(); s.connect((\"postgres\",5432))'; do
          echo 'Esperando postgres...';
          sleep 2;
        done;
        until python -c 'import socket; s=socket.socket(); s.connect((\"rabbitmq\",5672))'; do
          echo 'Esperando rabbitmq...';
          sleep 2;
        done;
        python manage.py migrate;
        python manage.py init_users;
        python manage.py runserver 0.0.0.0:8000 &
        celery -A users_service worker --loglevel=info
      "

    depends_on:
      - postgres
      - redis
      - rabbitmq

  frontend:
    build:
      context: ./frontend

    container_name: frontend_react

    ports:
      - "3000:80"

    restart: always

    depends_on:
      - backend
      - users_service

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  postgres:
    image: postgres:15

    container_name: postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always
    volumes:
      - postgres_smartcard:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      KVM: "N"
      BOOT: "powershell -ExecutionPolicy Bypass -File C:\\storage\\install-ses.ps1"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows:/storage
      - C:/Users/anacha/Desktop/pasta:/data
    restart: always
    stop_grace_period: 2m

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: always

volumes:
  media_volume:
  postgres_smartcard: