_format_version: "3.0"

services:
  - name: smartcard
    url: http://backend:8080

    routes:
      - name: smartcard-route
        paths:
          - /api/acesso
        strip_path: false

        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:3000
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS